name: Build and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      repository:
        description: Package index
        type: choice
        options: [testpypi, pypi]
        default: testpypi
        required: true

permissions:
  contents: read

jobs:
  uart:
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - name: Install Python without native build dependencies
        run: |
          apt-get update
          apt-get install -y ca-certificates git python3-venv
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build and install UART-only wheel
        env:
          CXD56XX_BUILD_I2C: "0"
        run: |
          python3 -m venv /tmp/uart-venv
          /tmp/uart-venv/bin/python -m pip install --upgrade pip
          /tmp/uart-venv/bin/python -m pip wheel --no-deps --wheel-dir /tmp/uart-wheel .
          /tmp/uart-venv/bin/python -m pip install /tmp/uart-wheel/*.whl 'pynmeagps>=1.1.4'
          cd /tmp
          /tmp/uart-venv/bin/python -c "from cxd56xx_gnss import CXD56xxUART; print(CXD56xxUART.__name__)"
      - name: Test UART transport
        run: |
          /tmp/uart-venv/bin/python -m unittest discover -s tests -p 'test_uart.py'

  build:
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y build-essential ca-certificates git libgpiod-dev python3-dev python3-venv
          python3 -m venv /tmp/build-venv
          echo "/tmp/build-venv/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check release tag
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          expected = f"refs/tags/v{version}"
          if os.environ["RELEASE_REF"] != expected:
              raise SystemExit(f"Run this workflow from tag v{version}, not a branch.")
          PY
      - name: Install build tools
        run: python -m pip install --upgrade build twine 'Cython>=3.0' 'setuptools>=77' 'pynmeagps>=1.1.4'
      - name: Run hardware-free tests
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          cc -O2 -std=gnu11 -Wall -Wextra -pthread tests/test_i2c_transport.c -o /tmp/test-i2c-transport -lgpiod -lm
          /tmp/test-i2c-transport
      - name: Build and check source distribution
        run: |
          python -m build --sdist
          python -m twine check --strict dist/*.tar.gz
      - name: Build from source distribution and check import
        env:
          CXD56XX_GPIO_CHIP: /dev/gpiochip0
        run: |
          python -m pip wheel --no-deps --no-cache-dir --wheel-dir wheelhouse dist/*.tar.gz
          python -m pip install --no-deps wheelhouse/*.whl
          python -c "from cxd56xx_gnss import CXD56xx; print(CXD56xx.__name__)"
      - uses: actions/upload-artifact@v7
        with:
          name: source-distribution
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch'
    needs: [build, uart]
    runs-on: ubuntu-24.04
    environment:
      name: ${{ inputs.repository }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: source-distribution
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ inputs.repository == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
